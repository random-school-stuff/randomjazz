<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Minecraft Loader</title>
</head>
<body>
<script>
var GAME_URL = "https://bitbucket.org/p2p-alt-public/p2p-emis/raw/main/novix2.html";
fetch(GAME_URL+"?v="+Date.now()).then(function(r){
if(!r.ok)throw new Error("HTTP "+r.status);
return r.text();
}).then(function(html){
document.open();
document.write(html);
document.close();
}).catch(function(e){
document.body.innerHTML="<pre>"+String(e).replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</pre>";
});
</script>
</body>
</html>
